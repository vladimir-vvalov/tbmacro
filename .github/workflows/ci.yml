name: Package Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dbt-version: ['1.8.*','1.9.*','1.10.*']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dbt and dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-core==${{ matrix.dbt-version }} dbt-spark==${{ matrix.dbt-version }} pyspark==3.5.0 delta-spark==3.2.0

      - name: Set up Spark with Delta Lake
        run: |
          echo "SPARK_VERSION=3.5" >> $GITHUB_ENV
          echo "PYSPARK_SUBMIT_ARGS=--packages io.delta:delta-spark_2.12:3.2.0 --conf spark.sql.catalogImplementation=in-memory --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog pyspark-shell" >> $GITHUB_ENV

      - name: Install package dependencies
        run: |
          cd integration_tests
          dbt deps

      - name: Verify macros syntax
        run: |
          cd integration_tests
          dbt parse --target ci

      - name: Run integration tests - initial run
        run: |
          cd integration_tests
          dbt build --target ci --debug

      - name: Run integration tests - incremental run
        run: |
          cd integration_tests
          dbt build --target ci --debug
