version: 2

seeds:
  - name: example_data
    description: "Example seed data for integration tests"
    config:
      column_types:
        id: integer
        value: integer
        created_date: date
    columns:
      - name: id
        description: "Unique identifier"
        data_type: integer

      - name: value
        description: "Test value"
        data_type: integer

      - name: created_date
        description: "Creation date"
        data_type: date
